<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0608" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CHS Theatre · Manager</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=8" />
  <style>
    .gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
    .gate .card { width: min(420px, 100%); padding: 34px 26px; text-align: center; }
    .gate img { width: 84px; margin: 0 auto 16px; }
    .gate h1 { font-family: var(--f-display); font-weight: 500; font-size: 32px; margin: 0 0 6px; }
    .gate p { color: var(--muted); margin: 0 0 22px; }
    .pin { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; direction: ltr; }
    .pin input { width: 46px; height: 58px; text-align: center; font: 600 26px var(--f-display); border-radius: 14px; border: 1px solid rgba(246,236,214,.14); background: rgba(255,240,220,.04); outline: none; transition: border-color .2s, box-shadow .2s; }
    .pin input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(217,180,106,.12); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 10px 0 26px; }
    @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .stat { padding: 18px; }
    .stat small { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
    .stat b { display: block; font-family: var(--f-display); font-weight: 500; font-size: 40px; line-height: 1.1; margin-top: 6px; }
    .stat.hot b { color: var(--warn); }
    .stat em { font-style: normal; font-size: 13px; color: var(--muted); }
    .tabs { display: flex; gap: 6px; padding: 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); width: fit-content; max-width: 100%; overflow-x: auto; }
    .tabs button { padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; transition: all .3s var(--ease); }
    .tabs button.on { background: linear-gradient(180deg, var(--red-hi), var(--red)); color: #fff; box-shadow: 0 6px 18px rgba(176,30,35,.35); }
    .tabs .cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px; background: rgba(255,255,255,.14); font-size: 11.5px; }
    .toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar .input { max-width: 260px; padding: 11px 14px; }
    @media (max-width: 600px) { .toolbar .input { max-width: none; } }
    .tabs { scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; }
    .stat.next b { font-size: 19px !important; line-height: 1.25; }
    .req { padding: 0; overflow: hidden; margin-bottom: 12px; }
    .req-h { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; width: 100%; text-align: start; }
    .req-date { width: 58px; text-align: center; border-radius: 14px; padding: 8px 0; background: rgba(217,180,106,.08); border: 1px solid var(--line); }
    .req-date small { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    .req-date b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.1; }
    .req-t { min-width: 0; }
    .req-t b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .req-t small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .req-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
    .req.open .req-b { grid-template-rows: 1fr; }
    .req-b > div { overflow: hidden; }
    .req-in { padding: 0 18px 18px; border-top: 1px solid var(--line); }
    .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .acts .btn { padding: 13px 20px; font-size: 15px; }
    .btn.ok { color: #fff; background: linear-gradient(180deg, #3aa86f, #23774c); box-shadow: 0 10px 30px rgba(35,119,76,.35); }
    .empty { text-align: center; padding: 50px 20px; color: var(--faint); }
    .empty svg { width: 40px; height: 40px; color: var(--gold); opacity: .6; margin-bottom: 10px; }
    .decide-wrap { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
    .decide { width: min(620px, 100%); padding: 26px 22px; }
    .decide h1 { font-family: var(--f-display); font-weight: 500; font-size: 30px; margin: 4px 0 4px; line-height: 1.15; }
    .big-state { text-align: center; padding: 20px 0 6px; }
    .big-state .ring { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; animation: pop .7s cubic-bezier(.2,1.5,.4,1); }
    .big-state .ring svg { width: 40px; height: 40px; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    .depts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .bar-row { display: grid; grid-template-columns: 90px 1fr 30px; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); margin: 6px 0; }
    .bar-row i { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--red), var(--gold)); display: block; }
  </style>
</head>
<body>
  <div class="stage-bg"><div class="beam b1"></div><div class="beam b2"></div></div>
  <div class="grain"></div>
  <div class="app" id="app"></div>
  <div class="toast" id="toast"></div>
  <script src="config.js?v=8"></script>
  <script src="api.js?v=8"></script>
  <script src="icons.js?v=8"></script>
  <script src="admin.js?v=8"></script>
</body>
</html>
