<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Theatre Reservation Form</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=UnifrakturMaguntia&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    @page { size: A4; margin: 0; }
    :root { --red: #8a1a1f; --ink: #1d1410; --mute: #7a6a5c; --line: #d9cbb4; --gold: #b48d45; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e9e2d6; color: var(--ink); font-family: Manrope, Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: #140a0d; color: #f6ecd6; font-size: 14px; }
    .bar button { font: 700 15px Manrope, sans-serif; padding: 12px 22px; border-radius: 999px; border: 0; cursor: pointer; color: #fff; background: linear-gradient(180deg, #d6333a, #b01e23); box-shadow: 0 8px 22px rgba(176, 30, 35, .4); }
    .bar a { color: #d9b46a; }
    .wrap { padding: 20px 10px 40px; overflow-x: auto; }
    .page { position: relative; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 12mm 15mm 10mm; background: #fffdf8; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; }
    .wm { position: absolute; left: 50%; top: 52%; width: 120mm; transform: translate(-50%, -50%); opacity: .06; pointer-events: none; }
    .frame { position: absolute; inset: 7mm; border: 1.2px solid var(--line); pointer-events: none; }
    .frame::after { content: ""; position: absolute; inset: 1.6mm; border: .5px solid var(--line); }
    header { position: relative; text-align: center; margin-bottom: 3mm; }
    header img { width: 15mm; margin: 0 auto 1mm; display: block; }
    .ar { font: 700 16pt/1.05 Amiri, serif; }
    .bl { font: 19pt/1.15 "UnifrakturMaguntia", serif; }
    h1 { font: italic 600 15pt "Playfair Display", serif; margin: 2mm 0 0; }
    h1 small { display: block; font: 700 7.5pt Manrope; letter-spacing: .3em; text-transform: uppercase; color: var(--red); margin-top: 1.5mm; font-style: normal; }
    .meta { position: absolute; top: 0; right: 0; text-align: right; font-size: 8pt; color: var(--mute); }
    .meta b { display: block; font: 700 13pt "Playfair Display", serif; color: var(--red); }
    .status { display: inline-block; margin-top: 1.5mm; padding: 1mm 3mm; border-radius: 99px; font-weight: 800; font-size: 7.5pt; letter-spacing: .08em; text-transform: uppercase; border: 1px solid; }
    .st-approved { color: #1f7a4d; border-color: #1f7a4d; } .st-pending { color: #b07a10; border-color: #b07a10; }
    .st-rejected, .st-cancelled { color: var(--mute); border-color: var(--mute); }
    .sec { position: relative; margin-top: 3.2mm; }
    .sec h2 { font: 800 7.5pt Manrope; letter-spacing: .22em; text-transform: uppercase; color: var(--red); margin: 0 0 1mm; padding-bottom: .8mm; border-bottom: 1.5px solid var(--red); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8mm; }
    .f { display: flex; gap: 3mm; align-items: baseline; padding: 1.1mm 0; border-bottom: .6px dotted #b9a88f; font-size: 9.5pt; min-height: 6.4mm; }
    .f.full { grid-column: 1 / -1; }
    .f i { font-style: italic; color: var(--mute); white-space: nowrap; font-family: "Playfair Display", serif; }
    .f b { font-weight: 700; flex: 1; }
    .chk { display: inline-flex; align-items: center; gap: 1.2mm; margin-inline-end: 3mm; font-weight: 600; white-space: nowrap; }
    .box { width: 3.6mm; height: 3.6mm; border: 1px solid var(--ink); display: inline-grid; place-items: center; font-size: 8pt; line-height: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    td, th { border: .8px solid #8f7f6c; padding: .9mm 2.6mm; text-align: left; }
    th { font: italic 600 10pt "Playfair Display", serif; background: #f6efe1; }
    td.c { width: 16mm; text-align: center; font-weight: 800; }
    .eqcols { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
    .yes { color: #1f7a4d; } .no { color: #c4b5a0; }
    .notes { font-size: 8.2pt; color: #3b2e25; margin: 0; padding-inline-start: 4mm; line-height: 1.4; }
    .other { min-height: 7mm; font-size: 10pt; padding: 2mm 0; border-bottom: .6px dotted #b9a88f; white-space: pre-wrap; }
    .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 10mm; margin-top: 4mm; font-size: 9.5pt; }
    .sign div > p { display: flex; gap: 2mm; margin: 0; padding: 2mm 0; border-bottom: .8px solid #8f7f6c; }
    .sign i { font-family: "Playfair Display", serif; color: var(--mute); white-space: nowrap; }
    .sign b { flex: 1; }
    footer { margin-top: 4mm; text-align: center; font: italic 500 10.5pt "Playfair Display", serif; color: var(--mute); }
    footer small { display: block; font: 7.5pt Manrope; font-style: normal; margin-top: 2mm; color: #a39280; }
    .msg { text-align: center; padding: 80px 20px; font-size: 16px; color: #5a4636; }
    @media print {
      html, body { background: #fff; }
      .bar { display: none; }
      .wrap { padding: 0; overflow: visible; }
      .page { box-shadow: none; margin: 0; width: 210mm; min-height: 297mm; }
    }
    @media screen and (max-width: 820px) { .page { transform-origin: top left; } }
  </style>
</head>
<body>
  <div class="bar" id="bar"><button id="printBtn">🖨️ Print / Save as PDF</button><span id="hint">On a phone: Print → “Save as PDF”.</span></div>
  <div class="wrap" id="wrap"><div class="msg">Loading…</div></div>
  <script src="config.js?v=7"></script>
  <script src="api.js?v=7"></script>
  <script src="print.js?v=7"></script>
</body>
</html>
